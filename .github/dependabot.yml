# Dependabot: automated dependency vulnerability scanning + security update PRs.
# Security updates (for known CVEs) are raised automatically once "Dependabot
# alerts" and "Dependabot security updates" are enabled in repo Settings →
# Code security. This file also schedules routine version-update checks.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    commit-message:
      prefix: "deps"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
    commit-message:
      prefix: "ci"
